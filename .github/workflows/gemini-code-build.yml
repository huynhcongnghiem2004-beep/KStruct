name: Gemini code and Revit 2024 build

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe the code change Gemini should make"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gemini-code-build-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate-build-pr:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create task branch
        shell: pwsh
        run: |
          $branch = "gemini-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "GEMINI_BRANCH=$branch" >> $env:GITHUB_ENV
          git switch --create $branch

      - name: Ask Gemini to implement the requested change
        uses: google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_cli_version: "0.31.0"
          prompt: |
            Implement the requested code change in this KStruct repository.

            Task:
            ${{ inputs.task }}

            Read and follow AGENTS.md and relevant project documentation. Make only changes needed for this task. Do not commit or push. Do not read, print, or modify secrets. Do not run tests unless the task explicitly asks for them. The next workflow step will build the Revit 2024 add-in; report any limits or assumptions in your final response.

      - name: Download pinned Revit 2024 compile references
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "revit2024.zip"
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/revit_all_main_versions_api_x64/2024.0.0/revit_all_main_versions_api_x64.2024.0.0.nupkg" -OutFile $package
          $expectedHash = "89B521D1F331A9AE450210AADD59F680412ED10B68AAFFA7EB5CC1E797D1DA00"
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne $expectedHash) { throw "Reference package checksum mismatch" }
          $references = Join-Path $env:RUNNER_TEMP "revit2024"
          Expand-Archive $package $references
          "REVIT_REFERENCE_DIR=$references\lib\net48\" >> $env:GITHUB_ENV

      - name: Build add-in against Revit 2024
        shell: pwsh
        run: |
          dotnet build KStruct.csproj --configuration Release "/p:RevitInstallDir=$env:REVIT_REFERENCE_DIR" 2>&1 | Tee-Object -FilePath revit2024-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check patch and save build artifact
        shell: pwsh
        run: |
          git diff --check
          $changes = git status --porcelain
          if (-not $changes) { throw "Gemini made no changes; no pull request was created." }
          if (Test-Path "bin/Release/KStruct.dll") { exit 0 }
          throw "Build output bin/Release/KStruct.dll was not produced."

      - name: Upload build output and log
        uses: actions/upload-artifact@v4
        with:
          name: KStruct-Gemini-Revit2024
          path: |
            bin/Release/KStruct.dll
            revit2024-build.log
          if-no-files-found: error

      - name: Commit changes and open pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_TASK: ${{ inputs.task }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Gemini requested change"
          git push --set-upstream origin $env:GEMINI_BRANCH
          $shortTask = ($env:GEMINI_TASK -replace "[\r\n]+", " ").Trim()
          if ($shortTask.Length -gt 70) { $shortTask = $shortTask.Substring(0, 67) + "..." }
          $title = "Gemini: $shortTask"
          $bodyPath = Join-Path $env:RUNNER_TEMP "gemini-pr-body.md"
          @"
          Generated by Gemini CLI and built successfully against the pinned Revit 2024 API references.

          Request: $env:GEMINI_TASK

          Review the code and test it in Revit before merging. The build artifact and log are attached to workflow run $env:GITHUB_RUN_ID.
          "@ | Set-Content -LiteralPath $bodyPath -Encoding utf8
          gh pr create --repo $env:GITHUB_REPOSITORY --base main --head $env:GEMINI_BRANCH --title $title --body-file $bodyPath
